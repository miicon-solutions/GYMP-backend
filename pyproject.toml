[project]
name = "gyma-backend"
version = "1.0.5"
description = "GYMA Django REST backend"
requires-python = ">=3.14,<3.15"
dependencies = [
  "django>=5.2.8,<5.3", "djangorestframework>=3.16,<4", "psycopg[binary]>=3.2,<4",
  "django-environ>=0.12,<1", "django-cors-headers>=4.7,<5", "drf-spectacular[sidecar]>=0.28,<1",
  "pyjwt>=2.10,<3", "cryptography>=45", "pyotp>=2.9,<3", "firebase-admin>=6.9,<8",
  "httpx>=0.28,<1", "pillow>=11.2", "gunicorn>=23,<24", "whitenoise>=6.9,<7",
  "django-storages[s3]>=1.14.6,<2", "django-filter>=24.0", "djangorestframework-simplejwt>=5.3"
]
[dependency-groups]
dev = ["pytest>=8.3", "pytest-django>=4.11", "ruff>=0.11"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
