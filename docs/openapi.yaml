        member_display_id:
          type: string
        member_name:
          type: string
      required:
      - amount_taka
      - channel
      - id
      - kind
      - member_display_id
      - member_id
      - member_name
      - plan_id
    RevenuePoint:
      type: object
      properties:
        bucket:
          type: string
        amount_taka:
          type: integer
        count:
          type: integer
      required:
      - amount_taka
      - bucket
      - count
    Session:
      type: object
      properties:
        tran_id:
          type: string
          maxLength: 30
        kind:
          type: string
          maxLength: 20
        plan_id:
          type: string
          format: uuid
          readOnly: true
        amount_taka:
          type: integer
          maximum: 2147483647
          minimum: 0
        status:
          type: string
          maxLength: 12
        gateway_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 2000
          - type: string
            maxLength: 0
        paid_at:
          type: string
          format: date-time
          nullable: true
      required:
      - amount_taka
      - kind
      - plan_id
      - tran_id
    SessionInput:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/SessionInputKindEnum'
        plan_id:
          type: string
          format: uuid
        checkout:
          allOf:
          - $ref: '#/components/schemas/CheckoutEnum'
          default: hosted
      required:
      - kind
      - plan_id
    SessionInputKindEnum:
      enum:
      - first_purchase
      - renew
      - change_plan
      type: string
      description: |-
        * `first_purchase` - first_purchase
        * `renew` - renew
        * `change_plan` - change_plan
    SetupInput:
      type: object
      properties:
        phone_e164:
          type: string
        setup_token:
          type: string
          maxLength: 128
      required:
      - phone_e164
      - setup_token
    SourceEnum:
      enum:
      - device
      - admin
      - manual
      type: string
      description: |-
        * `device` - device
        * `admin` - admin
        * `manual` - manual
    Staff:
      type: object
      properties:
        id:
          type: string
          format: uuid
        short_id:
          type: string
        name:
          type: string
        phone_e164:
          type: string
        is_active:
          type: boolean
        is_super:
          type: boolean
        mfa_enrolled:
          type: boolean
          readOnly: true
      required:
      - id
      - is_active
      - is_super
      - mfa_enrolled
      - name
      - phone_e164
      - short_id
    StaffInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        phone_e164:
          type: string
        is_active:
          type: boolean
          default: true
      required:
      - name
      - phone_e164
    StaffOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
        short_id:
          type: string
        name:
          type: string
        phone_e164:
          type: string
        is_super:
          type: boolean
        is_active:
          type: boolean
        mfa_enrolled:
          type: boolean
      required:
      - id
      - is_active
      - is_super
      - mfa_enrolled
      - name
      - phone_e164
      - short_id
    TokenOutput:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
        expires_in_sec:
          type: integer
        member:
          $ref: '#/components/schemas/MemberOutput'
        staff:
          $ref: '#/components/schemas/StaffOutput'
      required:
      - access_token
      - expires_in_sec
      - refresh_token
      - token_type
    UnlockInput:
      type: object
      properties:
        phone_e164:
          type: string
        totp_code:
          type: string
          pattern: ^[0-9]{6}$
      required:
      - phone_e164
      - totp_code
    VerifyInput:
      type: object
      properties:
        otp_session_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: ^[0-9]{6}$
      required:
      - code
      - otp_session_id
    WeekInput:
      type: object
      properties:
        week:
          type: array
          items:
            $ref: '#/components/schemas/WeekdayInput'
      required:
      - week
    WeekdayInput:
      type: object
      properties:
        weekday:
          type: integer
          maximum: 7
          minimum: 1
        is_open:
          type: boolean
        open_time:
          type: string
          format: time
          nullable: true
        close_time:
          type: string
          format: time
          nullable: true
      required:
      - is_open
      - weekday
    Welcome:
      type: object
      properties:
        app_name:
          type: string
        environment:
          type: string
        message:
          type: string
      required:
      - app_name
      - environment
      - message
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    deviceKey:
      type: apiKey
      in: header
      name: X-Device-Key
