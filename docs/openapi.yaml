components:
  schemas:
    Activity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        at:
          type: string
          format: date-time
        admin_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        admin_name:
          type: string
          maxLength: 200
        admin_short_id:
          type: string
          maxLength: 24
        area:
          type: string
          maxLength: 20
        action:
          type: string
          maxLength: 20
        summary_key:
          type: string
          maxLength: 100
        summary_params: {}
      required:
      - action
      - admin_id
      - admin_name
      - admin_short_id
      - area
      - at
      - id
      - summary_key
    AdminMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
        member_id:
          type: string
        phone_e164:
          type: string
        full_name:
          type: string
        email:
          type: string
          format: email
          nullable: true
        signed_in_with_google:
          type: boolean
        profile_complete:
          type: boolean
        membership_status:
          type: string
        emergency_name:
          type: string
        emergency_relationship:
          type: string
        emergency_phone_e164:
          type: string
        blood_group:
          type: string
        photo_url:
          type: string
          nullable: true
        fingerprint_status:
          type: string
        plan:
          allOf:
          - $ref: '#/components/schemas/PlanBrief'
          nullable: true
        expires_on:
          type: string
          format: date
          nullable: true
        last_paid_at:
          type: string
          format: date-time
          nullable: true
      required:
      - blood_group
      - email
      - emergency_name
      - emergency_phone_e164
      - emergency_relationship
      - expires_on
      - fingerprint_status
      - full_name
      - id
      - last_paid_at
      - member_id
      - membership_status
      - phone_e164
      - photo_url
      - plan
      - profile_complete
      - signed_in_with_google
    AdminMemberOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
        member_id:
          type: string
        phone_e164:
          type: string
        full_name:
          type: string
        email:
          type: string
          format: email
          nullable: true
        signed_in_with_google:
          type: boolean
        profile_complete:
          type: boolean
        membership_status:
          type: string
        emergency_name:
          type: string
        emergency_relationship:
          type: string
        emergency_phone_e164:
          type: string
        blood_group:
          type: string
        photo_url:
          type: string
          nullable: true
        fingerprint_status:
          type: string
        plan:
          allOf:
          - $ref: '#/components/schemas/PlanBrief'
          nullable: true
        expires_on:
          type: string
          format: date
          nullable: true
        last_paid_at:
          type: string
          format: date-time
          nullable: true
      required:
      - blood_group
      - email
      - emergency_name
      - emergency_phone_e164
      - emergency_relationship
      - expires_on
      - fingerprint_status
      - full_name
      - id
      - last_paid_at
      - member_id
      - membership_status
      - phone_e164
      - photo_url
      - plan
      - profile_complete
      - signed_in_with_google
    BloodGroupEnum:
      enum:
      - A+
      - A-
      - B+
      - B-
      - AB+
      - AB-
      - O+
      - O-
      - Unknown
      type: string
      description: |-
        * `A+` - A+
        * `A-` - A-
        * `B+` - B+
        * `B-` - B-
        * `AB+` - AB+
        * `AB-` - AB-
        * `O+` - O+
        * `O-` - O-
        * `Unknown` - Unknown
    CashPreviewOutput:
      type: object
      properties:
        kind:
          type: string
        amount_taka:
          type: integer
        new_expires_on:
          type: string
          format: date
        plan_id:
          type: string
          format: uuid
        catalog_id:
          type: string
          nullable: true
      required:
      - amount_taka
      - catalog_id
      - kind
      - new_expires_on
      - plan_id
    CashReceive:
      type: object
      properties:
        member:
          $ref: '#/components/schemas/AdminMemberOutput'
        payment:
          $ref: '#/components/schemas/Payment'
      required:
      - member
      - payment
    CategoryEnum:
      enum:
      - rent
      - utilities
      - salary
      - equipment
      - other
      type: string
      description: |-
        * `rent` - rent
        * `utilities` - utilities
        * `salary` - salary
        * `equipment` - equipment
        * `other` - other
    ChannelEnum:
      enum:
      - cash
      - sslcommerz
      type: string
      description: |-
        * `cash` - Cash
        * `sslcommerz` - SSLCommerz
    CheckInInput:
      type: object
      properties:
        member_id:
          type: string
          maxLength: 24
        checked_in_at:
          type: string
          format: date-time
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          default: device
      required:
      - member_id
    CheckInOutput:
      type: object
      properties:
        member_uuid:
          type: string
          format: uuid
        member_id:
          type: string
        day:
          type: string
          format: date
        recorded:
          type: boolean
        checked_in_at:
          type: string
          format: date-time
      required:
      - checked_in_at
      - day
      - member_id
      - member_uuid
      - recorded
    CheckoutEnum:
      enum:
      - sdk
      - hosted
      type: string
      description: |-
        * `sdk` - sdk
        * `hosted` - hosted
    ConfirmInput:
      type: object
      properties:
        phone_e164:
          type: string
        setup_token:
          type: string
          maxLength: 128
        totp_code:
          type: string
          pattern: ^[0-9]{6}$
      required:
      - phone_e164
      - setup_token
      - totp_code
    Cost:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 200
        category:
          $ref: '#/components/schemas/CategoryEnum'
        amount_taka:
          type: integer
          maximum: 2147483647
          minimum: 0
        date:
          type: string
          format: date
        note:
          type: string
          nullable: true
        is_archived:
          type: boolean
          readOnly: true
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        clear_note:
          type: boolean
          writeOnly: true
      required:
      - amount_taka
      - category
      - created_at
      - created_by
      - date
      - id
      - is_archived
      - title
      - updated_at
    DashboardOutput:
      type: object
      properties:
        timezone:
          type: string
        is_open_now:
          type: boolean
        status:
          type: string
        today_is_holiday:
          type: boolean
        today_holiday_name:
          type: string
          nullable: true
        today_is_weekly_closed:
          type: boolean
        today_open_time:
          type: string
          nullable: true
        today_close_time:
          type: string
          nullable: true
        hours_summary:
          type: string
        closed_day_label:
          type: string
          nullable: true
        week:
          type: array
          items:
            $ref: '#/components/schemas/WeekdayInput'
        upcoming_holidays:
          type: array
          items:
            $ref: '#/components/schemas/Holiday'
        member_id:
          type: string
        full_name:
          type: string
        plan:
          allOf:
          - $ref: '#/components/schemas/PlanBrief'
          nullable: true
        expires_on:
          type: string
          format: date
          nullable: true
        days_left:
          type: integer
          nullable: true
        visits_this_month:
          type: integer
        last_check_in_at:
          type: string
          format: date-time
          nullable: true
        fingerprint_status:
          type: string
        gym_status:
          type: string
        payment_preview:
