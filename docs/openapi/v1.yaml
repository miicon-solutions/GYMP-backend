components:
  schemas:
    Activity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        at:
          type: string
          format: date-time
        admin_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        admin_name:
          type: string
          maxLength: 200
        admin_short_id:
          type: string
          maxLength: 24
        area:
          type: string
          maxLength: 20
        action:
          type: string
          maxLength: 20
        summary_key:
          type: string
          maxLength: 100
        summary_params: {}
      required:
      - action
      - admin_id
      - admin_name
      - admin_short_id
      - area
      - at
      - id
      - summary_key
    AdminAnnouncement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        scope:
          type: string
        member_id:
          type: string
          format: uuid
          nullable: true
        recipient_count:
          type: integer
        send_push_requested:
          type: boolean
        send_sms_requested:
          type: boolean
        created_at:
          type: string
          format: date-time
        created_by:
          allOf:
          - $ref: '#/components/schemas/AdminAnnouncementCreatedBy'
          nullable: true
      required:
      - body
      - created_at
      - created_by
      - id
      - member_id
      - recipient_count
      - scope
      - send_push_requested
      - send_sms_requested
      - title
    AdminAnnouncementCreateOutput:
      type: object
      description: Campaign fields plus push/SMS delivery summary and legacy `created`
        alias.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        scope:
          type: string
        member_id:
          type: string
          format: uuid
          nullable: true
        recipient_count:
          type: integer
        send_push_requested:
          type: boolean
        send_sms_requested:
          type: boolean
        created_at:
          type: string
          format: date-time
        created_by:
          allOf:
          - $ref: '#/components/schemas/AdminAnnouncementCreatedBy'
          nullable: true
        created:
          type: integer
        push_requested:
          type: boolean
        push_sent:
          type: integer
        push_failed:
          type: integer
        push_skipped_no_device:
          type: integer
        push_skipped_disabled:
          type: integer
        sms_requested:
          type: boolean
        sms_sent:
          type: integer
        sms_failed:
          type: integer
        sms_skipped_disabled:
          type: integer
        sms_skipped_no_phone:
          type: integer
      required:
      - body
      - created
      - created_at
      - created_by
      - id
