          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        rpe:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,1})?$
          readOnly: true
          nullable: true
        is_pr:
          type: boolean
          readOnly: true
        calculated_1rm:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
          description: Pounds
        calculated_1rm_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
        performed_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - calculated_1rm
      - calculated_1rm_kg
      - distance_km
      - duration_seconds
      - exercise
      - id
      - is_pr
      - performed_at
      - reps
      - rpe
      - set_number
      - set_type
      - weight
      - weight_kg
      - weight_lbs
      - weight_unit
    YouTubeSearchOutput:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/YouTubeSearchResult'
      required:
      - results
    YouTubeSearchResult:
      type: object
      properties:
        video_id:
          type: string
        youtube_url:
          type: string
          format: uri
        title:
          type: string
        channel_title:
          type: string
        thumbnail_url:
          oneOf:
          - type: string
            format: uri
          - type: string
            maxLength: 0
        duration_text:
          type: string
        duration_seconds:
          type: integer
          nullable: true
      required:
      - channel_title
      - duration_seconds
      - duration_text
      - thumbnail_url
      - title
      - video_id
      - youtube_url
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    deviceKey:
      type: apiKey
      in: header
      name: X-Device-Key
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
