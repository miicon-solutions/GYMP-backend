name: (Dev) GYMP Backend

on:
  push:
    branches:
      - dev

env:
  TAG: ${{ github.run_number }}-stage
  IMAGE_NAME: miicon/gymp_backend
  CONTAINER_NAME: gymp_backend
  SERVER_PATH: /root/gym_platform/backend


jobs:
  notify-start:
    name: Notify Discord Start
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord (Started)
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: Custom
          title: "${{ github.workflow }} - started"
          color: 0x3498db
          description: |
            **Branch:** `${{ github.ref_name }}`
            **Pushed by:** `${{ github.actor }}`
            **Commit:** `${{ github.sha }}`
            **Message:** ${{ github.event.head_commit.message }}

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_SSH_HOST_DEV }}
          username: root
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY_DEV }}
          script: |
            set -e
            cd ${{ env.SERVER_PATH }}
            echo "${{ secrets.DOCKER_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            export INFISICAL_TOKEN="${{ secrets.INFISICAL_TOKEN_DEV }}"
            export TAG="${{ env.TAG }}"
            docker compose -p ${{ env.CONTAINER_NAME }} pull
            docker compose -p ${{ env.CONTAINER_NAME }} up -d --remove-orphans
            docker image prune -af

  notify-finish:
    name: Notify Discord Finish
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord (Finished)
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ contains(needs.*.result, 'failure') && 'Failure' || contains(needs.*.result, 'cancelled') && 'Cancelled' || 'Success' }}
          title: "${{ github.workflow }} - finished"
          description: |
            **Branch:** `${{ github.ref_name }}`
            **Pushed by:** `${{ github.actor }}`
            **Commit:** `${{ github.sha }}`
            **Message:** ${{ github.event.head_commit.message }}
