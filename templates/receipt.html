<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>GYMA receipt</title><body><main><h1>Payment receipt</h1><p>{{ member.user.full_name }} · PG-{{ member.member_id }}</p><p>Receipt {{ payment.id }}</p><p>Paid {{ payment.paid_at }} via {{ payment.channel }}</p><table><thead><tr><th>Item</th><th>BDT</th></tr></thead><tbody>{% for item in payment.line_items %}<tr><td>{{ item.label }}</td><td>{{ item.amount_taka }}</td></tr>{% endfor %}</tbody></table><p>Total: BDT {{ payment.amount_taka }}</p></main></body></html>
