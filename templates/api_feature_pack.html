<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ feature }} — GYMA API</title>
  <style>
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background: #f3f0e8;
      color: #14201a;
      line-height: 1.55;
    }
    header, main { max-width: 880px; margin: 0 auto; padding: 1.25rem; }
    header { padding-bottom: 0; }
    a { color: #0f6b4c; }
    pre {
      background: #14201a;
      color: #e7f3ec;
      padding: 1rem;
      overflow: auto;
      border-radius: 8px;
      font-size: 0.86rem;
    }
    code { font-size: 0.92em; }
    .nav { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1rem; }
    article h1:first-child { margin-top: 0; font-family: "IBM Plex Serif", Georgia, serif; }
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <a href="{{ docs_url }}">Docs UI</a>
      <a href="/docs/features/">All features</a>
      <a href="{{ openapi_url }}">Feature OpenAPI</a>
      <a href="{{ schema_url }}">Full OpenAPI</a>
      <a href="?format=md">Raw markdown</a>
    </div>
  </header>
    <main>
    <article style="white-space: pre-wrap; background: #fff; padding: 1.25rem; border-radius: 8px; border: 1px solid #d5d0c4;">{{ content }}</article>
  </main>
</body>
</html>
