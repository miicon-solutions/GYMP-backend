{# Scalar Copy as Markdown uses ClipboardItem + clipboard.write, which fails outside
   secure contexts (e.g. http://192.168.x.x) and in some browsers. Fall back to
   writeText / execCommand so copy works on LAN HTTP and Safari. #}
<script>
(function () {
  function copyViaExecCommand(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "0";
    ta.style.left = "0";
    ta.style.width = "1px";
    ta.style.height = "1px";
    ta.style.padding = "0";
    ta.style.border = "none";
    ta.style.outline = "none";
    ta.style.boxShadow = "none";
    ta.style.background = "transparent";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    var ok = false;
    try {
      ok = document.execCommand("copy");
    } finally {
      document.body.removeChild(ta);
    }
    if (!ok) throw new Error("execCommand copy failed");
  }

  var NativeClipboardItem = window.ClipboardItem;
  window.ClipboardItem = function ClipboardItem(items) {
    this._items = items || {};
    this._native = null;
    if (NativeClipboardItem) {
      try {
        this._native = new NativeClipboardItem(items);
      } catch (_) {
        this._native = null;
      }
    }
  };
  window.ClipboardItem.prototype.getType = function (type) {
    if (this._native) return this._native.getType(type);
    var value = this._items[type];
    return Promise.resolve(value).then(function (resolved) {
      if (resolved instanceof Blob) return resolved;
      return new Blob([resolved == null ? "" : String(resolved)], {
        type: type || "text/plain",
      });
    });
  };
  Object.defineProperty(window.ClipboardItem.prototype, "types", {
    get: function () {
      return this._native ? this._native.types : Object.keys(this._items);
    },
  });

  if (!navigator.clipboard) {
    Object.defineProperty(navigator, "clipboard", {
      configurable: true,
      value: {},
    });
  }

  var nativeWriteText = navigator.clipboard.writeText
    ? navigator.clipboard.writeText.bind(navigator.clipboard)
    : null;

  navigator.clipboard.writeText = async function (text) {
    if (nativeWriteText) {
      try {
        await nativeWriteText(text);
        return;
      } catch (_) {}
    }
    copyViaExecCommand(String(text == null ? "" : text));
  };

  // Always resolve item text ourselves — native promise ClipboardItem.write is unreliable.
  navigator.clipboard.write = async function (items) {
    var parts = [];
    for (var i = 0; i < items.length; i++) {
      var blob = await items[i].getType("text/plain");
      parts.push(await blob.text());
    }
    await navigator.clipboard.writeText(parts.join("\n"));
  };
})();
</script>
