name: gyma-django
services:
  api:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your external PostgreSQL database}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HTTP_PORT:-8080}:8080"
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py seed_dev && exec gunicorn config.wsgi:application --bind 0.0.0.0:8080 --workers 2 --threads 4 --timeout 60 --access-logfile /dev/null"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request, urllib.parse; host=urllib.parse.urlsplit(os.getenv('PUBLIC_BASE_URL', 'http://localhost:8080')).netloc; urllib.request.urlopen(urllib.request.Request('http://localhost:8080/health/', headers={'Host': host}), timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
  test:
    profiles: [test]
    build:
      context: .
      target: test
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your external PostgreSQL database}
      MEDIA_STORAGE: filesystem
    extra_hosts:
      - "host.docker.internal:host-gateway"
